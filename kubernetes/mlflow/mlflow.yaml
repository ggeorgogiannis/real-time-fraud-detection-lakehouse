apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: model-registry
    app.kubernetes.io/part-of: fraud-lakehouse
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: model-registry
    app.kubernetes.io/part-of: fraud-lakehouse
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: model-registry
    app.kubernetes.io/part-of: fraud-lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/component: model-registry
        app.kubernetes.io/part-of: fraud-lakehouse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: fraud-lakehouse-mlflow:local
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - $(MLFLOW_BACKEND_STORE_URI)
            - --artifacts-destination
            - /opt/mlflow/artifacts
            - --serve-artifacts
            - --allowed-hosts
            - >-
              localhost:15000,127.0.0.1:15000,mlflow:5000,mlflow.fraud-lakehouse.svc.cluster.local:5000
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-postgres
                  key: password
            - name: MLFLOW_BACKEND_STORE_URI
              value: >-
                postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@mlflow-postgres:5432/$(POSTGRES_DB)
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /opt/mlflow/artifacts
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
      terminationGracePeriodSeconds: 30