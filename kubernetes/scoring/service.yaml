apiVersion: v1
kind: Service
metadata:
  name: scoring-api
  labels:
    app.kubernetes.io/name: scoring-api
    app.kubernetes.io/part-of: fraud-lakehouse
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: scoring-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: scoring-api-metrics
  labels:
    app.kubernetes.io/name: scoring-api
    app.kubernetes.io/part-of: fraud-lakehouse
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: scoring-api
  ports:
    - name: metrics
      port: 8000
      targetPort: http