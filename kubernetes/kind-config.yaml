kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fraud-lakehouse

networking:
  apiServerAddress: 127.0.0.1

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18000
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30500
        hostPort: 15000
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30090
        hostPort: 19090
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30300
        hostPort: 13000
        listenAddress: 127.0.0.1
        protocol: TCP