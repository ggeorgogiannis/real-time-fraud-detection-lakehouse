name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linting
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

  container:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config > /dev/null

      - name: Build application image
        run: docker build --tag fraud-lakehouse:ci .

      - name: Verify container CLI
        run: docker run --rm fraud-lakehouse:ci --help

      - name: Verify non-root execution
        run: test "$(docker run --rm --entrypoint id fraud-lakehouse:ci -u)" != "0"

  airflow:
    name: Airflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Airflow Compose configuration
        run: |
          docker compose \
            --env-file .env.example \
            --file compose.airflow.yaml \
            config > /dev/null

      - name: Build Airflow image
        run: |
          docker build \
            --file Dockerfile.airflow \
            --tag fraud-lakehouse-airflow:ci \
            .

      - name: Verify Airflow runtime
        run: docker run --rm fraud-lakehouse-airflow:ci airflow version

      - name: Verify packaged project CLI
        run: docker run --rm --entrypoint fraud-lakehouse fraud-lakehouse-airflow:ci --help

      - name: Verify non-root execution
        run: test "$(docker run --rm --entrypoint id fraud-lakehouse-airflow:ci -u)" != "0"

      - name: Validate DAG definition
        run: |
          docker run --rm --interactive \
            --volume "${PWD}/airflow/dags:/opt/airflow/dags:ro" \
            --entrypoint python \
            fraud-lakehouse-airflow:ci - <<'PY'
          import runpy

          namespace = runpy.run_path(
              "/opt/airflow/dags/fraud_lakehouse_daily.py"
          )
          dag = namespace["dag"]

          assert dag.dag_id == "fraud_lakehouse_daily"
          assert set(dag.task_ids) == {
              "run_batch_pipeline",
              "build_analytics_database",
          }
          assert dag.get_task(
              "run_batch_pipeline"
          ).downstream_task_ids == {
              "build_analytics_database"
          }
          PY
