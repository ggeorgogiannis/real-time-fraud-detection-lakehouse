name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linting
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

  container:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config > /dev/null

      - name: Build application image
        run: docker build --tag fraud-lakehouse:ci .

      - name: Verify container CLI
        run: docker run --rm fraud-lakehouse:ci --help

      - name: Verify non-root execution
        run: test "$(docker run --rm --entrypoint id fraud-lakehouse:ci -u)" != "0"

  airflow:
    name: Airflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Airflow Compose configuration
        run: |
          docker compose \
            --env-file .env.example \
            --file compose.airflow.yaml \
            config > /dev/null

      - name: Build Airflow image
        run: |
          docker build \
            --file Dockerfile.airflow \
            --tag fraud-lakehouse-airflow:ci \
            .

      - name: Verify Airflow runtime
        run: docker run --rm fraud-lakehouse-airflow:ci airflow version

      - name: Verify packaged project CLI
        run: docker run --rm --entrypoint fraud-lakehouse fraud-lakehouse-airflow:ci --help

      - name: Verify non-root execution
        run: test "$(docker run --rm --entrypoint id fraud-lakehouse-airflow:ci -u)" != "0"

      - name: Validate DAG definition
        run: |
          docker run --rm --interactive \
            --volume "${PWD}/airflow/dags:/opt/airflow/dags:ro" \
            --entrypoint python \
            fraud-lakehouse-airflow:ci - <<'PY'
          import runpy

          namespace = runpy.run_path(
              "/opt/airflow/dags/fraud_lakehouse_daily.py"
          )
          dag = namespace["dag"]

          assert dag.dag_id == "fraud_lakehouse_daily"
          assert set(dag.task_ids) == {
              "run_batch_pipeline",
              "build_analytics_database",
          }
          assert dag.get_task(
              "run_batch_pipeline"
          ).downstream_task_ids == {
              "build_analytics_database"
          }
          PY

  streaming:
    name: Streaming checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate streaming Compose configuration
        run: |
          docker compose \
            --file compose.streaming.yaml \
            --profile pipeline \
            --profile replay \
            config > /dev/null

      - name: Build Spark image
        run: |
          docker build \
            --file Dockerfile.spark \
            --tag fraud-lakehouse-spark:ci \
            .

      - name: Verify Spark runtime
        run: docker run --rm fraud-lakehouse-spark:ci

      - name: Verify non-root execution
        run: |
          test "$(
            docker run \
              --rm \
              --entrypoint id \
              fraud-lakehouse-spark:ci \
              -u
          )" != "0"

      - name: Verify streaming job entry points
        run: |
          docker run \
            --rm \
            --entrypoint /opt/spark/bin/spark-submit \
            fraud-lakehouse-spark:ci \
            /opt/spark/app/src/fraud_lakehouse/streaming_ingestion_job.py \
            --help

          docker run \
            --rm \
            --entrypoint /opt/spark/bin/spark-submit \
            fraud-lakehouse-spark:ci \
            /opt/spark/app/src/fraud_lakehouse/streaming_gold_job.py \
            --help

      - name: Run Spark streaming validations
        run: |
          for script in \
            validate_streaming_parsing.py \
            validate_streaming_quality.py \
            validate_streaming_deduplication.py \
            validate_streaming_outputs.py \
            validate_streaming_pipeline.py \
            validate_streaming_gold.py \
            validate_streaming_gold_pipeline.py
          do
            docker run \
              --rm \
              --volume "${PWD}/tests/spark:/opt/spark/tests:ro" \
              --entrypoint /opt/spark/bin/spark-submit \
              fraud-lakehouse-spark:ci \
              "/opt/spark/tests/${script}"
          done

  mlops:
      name: MLOps and Kubernetes checks
      runs-on: ubuntu-latest
      timeout-minutes: 30

      steps:
        - name: Check out repository
          uses: actions/checkout@v4

        - name: Validate MLOps Compose configuration
          run: |
            docker compose \
              --env-file .env.mlops.example \
              --file compose.mlops.yaml \
              config > /dev/null

        - name: Validate Prometheus configuration
          run: |
            docker run \
              --rm \
              --volume "${PWD}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
              --entrypoint /bin/promtool \
              prom/prometheus:v3.16.0 \
              check config \
              /etc/prometheus/prometheus.yml

        - name: Build MLflow image
          run: |
            docker build \
              --file Dockerfile.mlflow \
              --tag fraud-lakehouse-mlflow:ci \
              .

        - name: Verify MLflow runtime
          run: |
            docker run \
              --rm \
              --entrypoint mlflow \
              fraud-lakehouse-mlflow:ci \
              --version

            docker run \
              --rm \
              --entrypoint python \
              fraud-lakehouse-mlflow:ci \
              -c "import mlflow, psycopg2; assert mlflow.__version__ == '3.10.1'"

        - name: Verify non-root MLflow execution
          run: |
            test "$(
              docker run \
                --rm \
                --entrypoint id \
                fraud-lakehouse-mlflow:ci \
                -u
            )" != "0"

        - name: Build scoring image
          run: |
            docker build \
              --file Dockerfile.scoring \
              --tag fraud-lakehouse-scoring:ci \
              .

        - name: Verify scoring runtime
          run: |
            docker run \
              --rm \
              --entrypoint python \
              fraud-lakehouse-scoring:ci \
              -c "import fastapi, mlflow, prometheus_client, uvicorn; import fraud_lakehouse.scoring_api"

        - name: Verify non-root scoring execution
          run: |
            test "$(
              docker run \
                --rm \
                --entrypoint id \
                fraud-lakehouse-scoring:ci \
                -u
            )" != "0"

        - name: Render Kubernetes manifests
          run: |
            kubectl version --client

            for directory in \
              kubernetes/mlflow \
              kubernetes/scoring \
              kubernetes/observability
            do
              rendered="/tmp/$(basename "${directory}")-manifests.yaml"

              kubectl kustomize "${directory}" > "${rendered}"

              test -s "${rendered}"
              grep -q '^kind:' "${rendered}"
            done

        - name: Validate Kubernetes deployment scripts
          run: |
            for script in kubernetes/*.sh
            do
              bash -n "${script}"
            done