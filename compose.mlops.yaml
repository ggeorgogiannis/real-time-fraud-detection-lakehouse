name: fraud-lakehouse-mlops

services:
  mlflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB:?MLFLOW_POSTGRES_DB must be set}
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER:?MLFLOW_POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:?MLFLOW_POSTGRES_PASSWORD must be set}
    volumes:
      - mlflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --username "$${POSTGRES_USER}"
          --dbname "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: fraud-lakehouse-mlflow:local
    depends_on:
      mlflow-postgres:
        condition: service_healthy
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - >-
        postgresql+psycopg2://${MLFLOW_POSTGRES_USER}:${MLFLOW_POSTGRES_PASSWORD}@mlflow-postgres:5432/${MLFLOW_POSTGRES_DB}
      - --artifacts-destination
      - /opt/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts
      - localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-artifacts:/opt/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:5000/version",
          timeout=3
          )
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  scoring-api:
    build:
      context: .
      dockerfile: Dockerfile.scoring
    image: fraud-lakehouse-scoring:local
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FRAUD_REGISTERED_MODEL_NAME: ${FRAUD_REGISTERED_MODEL_NAME:-fraud-detection-policy}
      FRAUD_MODEL_ALIAS: ${FRAUD_MODEL_ALIAS:-champion}
      FRAUD_SCORING_MAX_BATCH_SIZE: ${FRAUD_SCORING_MAX_BATCH_SIZE:-100}
    ports:
      - "127.0.0.1:8000:8000"
    stop_grace_period: 30s

volumes:
  mlflow-postgres:
  mlflow-artifacts: