name: fraud-lakehouse-mlops

services:
  mlflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB:?MLFLOW_POSTGRES_DB must be set}
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER:?MLFLOW_POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:?MLFLOW_POSTGRES_PASSWORD must be set}
    volumes:
      - mlflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --username "$${POSTGRES_USER}"
          --dbname "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: fraud-lakehouse-mlflow:local
    depends_on:
      mlflow-postgres:
        condition: service_healthy
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - >-
        postgresql+psycopg2://${MLFLOW_POSTGRES_USER}:${MLFLOW_POSTGRES_PASSWORD}@mlflow-postgres:5432/${MLFLOW_POSTGRES_DB}
      - --artifacts-destination
      - /opt/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts
      - localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-artifacts:/opt/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:5000/version",
          timeout=3
          )
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  scoring-api:
    build:
      context: .
      dockerfile: Dockerfile.scoring
    image: fraud-lakehouse-scoring:local
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FRAUD_REGISTERED_MODEL_NAME: ${FRAUD_REGISTERED_MODEL_NAME:-fraud-detection-policy}
      FRAUD_MODEL_ALIAS: ${FRAUD_MODEL_ALIAS:-champion}
      FRAUD_SCORING_MAX_BATCH_SIZE: ${FRAUD_SCORING_MAX_BATCH_SIZE:-100}
    ports:
      - "127.0.0.1:8000:8000"
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v3.16.0
    depends_on:
      scoring-api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:9090/-/healthy
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  grafana:
    image: grafana/grafana:13.3.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

volumes:
  mlflow-postgres:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
